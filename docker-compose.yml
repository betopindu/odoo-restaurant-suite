services:
  db:
    image: postgres:15
    container_name: restaurant_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-odoo:17.0-xmlsec
    container_name: restaurant_odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    env_file:
      - .env
    environment:
      SIFEN_P12_PASSWORD: ${SIFEN_P12_PASSWORD}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./config/odoo.conf:/etc/odoo/odoo.conf
      - ./custom_addons:/mnt/extra-addons
      - ${HOME}/.secrets/sifen:/run/secrets/sifen:ro
    command: odoo -c /etc/odoo/odoo.conf
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  odoo_data:
